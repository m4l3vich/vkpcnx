name: Build vkpcnx

on:
  push:
    tags:
      - 'v*'

jobs:
  switch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkita64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          dkp-pacman -Sy --noconfirm --needed \
            switch-curl switch-zlib switch-libopus switch-ffmpeg switch-libwebp \
            switch-glfw switch-mesa switch-libdrm_nouveau
      - name: Build
        run: ./scripts/build-switch.sh
      - name: Build debug
        run: ./scripts/build-switch.sh --debug
      - name: Collect release files
        # The .nro carries no debug info; the ELF it was made from does, and
        # its build id is the Module Id in Atmosphère crash reports. Each ELF
        # ships as a single .elf.gz next to its .nro
        run: |
          mkdir release
          cp build-switch/vkpcnx.nro release/vkpcnx.nro
          cp build-switch-debug/vkpcnx.nro release/vkpcnx-debug.nro
          gzip -9 -c build-switch/vkpcnx.elf > release/vkpcnx-switch-symbols.elf.gz
          gzip -9 -c build-switch-debug/vkpcnx.elf > release/vkpcnx-switch-debug-symbols.elf.gz
      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: VKPCNX ${{ github.ref_name }}
          body: |
            TODO: changelog

            **Скопируйте файл `vkpcnx.nro` в папку `switch` на SD-карте вашего Nintendo Switch, а затем запустите "VK Play Cloud NX" через hbmenu**

            - `vkpcnx.nro` — релизная сборка, **скачивайте её**
            - `vkpcnx-debug.nro` — отладочная сборка

            Сборка выполнена через GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          fail_on_unmatched_files: true
          files: release/*
